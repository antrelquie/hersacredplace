
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400;500&family=Dancing+Script:wght@500&display=swap');

.j-wrap{font-family:'Lato',sans-serif;padding:1.5rem 0;max-width:660px;margin:0 auto}
.j-book{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden}
.j-top{background:linear-gradient(135deg,#f9eef1,#f3edf8,#faf3e6);padding:24px 28px 20px;border-bottom:0.5px solid var(--color-border-tertiary)}
.j-logo{font-family:'Dancing Script',cursive;font-size:22px;color:#a54d62;margin-bottom:4px}
.j-tagline{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#a08090}
.j-body{padding:24px 28px 28px}
.j-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.j-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.j-field{display:flex;flex-direction:column;gap:4px}
.j-field.full{grid-column:1/-1}
.j-lbl{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--color-text-secondary)}
.j-input{border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:9px 12px;font-family:'Lato',sans-serif;font-size:13px;color:var(--color-text-primary);background:var(--color-background-secondary);outline:none;transition:border-color .18s,background .18s;-webkit-appearance:none;width:100%}
.j-input:focus{border-color:#d4788a;background:var(--color-background-primary);box-shadow:0 0 0 3px rgba(212,120,138,.1)}
.j-verse-box{margin-bottom:16px}
.j-verse-input{width:100%;border:0.5px solid #c9a96e;border-radius:var(--border-radius-md);padding:11px 14px;font-family:'Playfair Display',serif;font-size:15px;font-style:italic;color:#8a6a35;background:#faf3e6;outline:none;transition:border-color .18s;-webkit-appearance:none}
.j-verse-input:focus{border-color:#8a6a35;box-shadow:0 0 0 3px rgba(201,169,110,.12)}
.j-goals{margin-bottom:20px}
.j-goals-header{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:8px}
.j-goals-list{display:flex;flex-direction:column;gap:6px}
.j-goal-row{display:flex;align-items:center;gap:8px}
.j-check{width:16px;height:16px;border:0.5px solid var(--color-border-secondary);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--color-background-secondary);transition:all .15s}
.j-check.done{background:#d4788a;border-color:#d4788a}
.j-check.done::after{content:'✓';font-size:10px;color:white;font-weight:500}
.j-goal-input{flex:1;border:none;border-bottom:0.5px solid var(--color-border-tertiary);padding:4px 2px;font-family:'Lato',sans-serif;font-size:13px;color:var(--color-text-primary);background:transparent;outline:none;transition:border-color .15s}
.j-goal-input:focus{border-bottom-color:#d4788a}
.j-goal-input.done-text{text-decoration:line-through;color:var(--color-text-secondary)}
.j-divider{height:0.5px;background:var(--color-border-tertiary);margin:16px 0;position:relative}
.j-divider-lbl{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--color-background-primary);padding:0 10px;font-family:'Dancing Script',cursive;font-size:13px;color:#c49aaa}
.j-lines-label{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:8px}
.j-lines{display:flex;flex-direction:column;gap:0}
.j-line-row{display:flex;align-items:flex-end;gap:0;height:44px}
.j-line-num{font-size:10px;color:#d4788a;opacity:.5;min-width:22px;padding-bottom:8px;font-family:'Lato',sans-serif;user-select:none}
.j-line-area{flex:1;border-bottom:0.5px solid rgba(232,213,218,.7);height:100%;cursor:text;position:relative}
.j-line-area:last-child{border-bottom:none}
.j-textarea-wrapper{position:relative;flex:1;height:44px}
.j-textarea-wrapper textarea{position:absolute;inset:0;width:100%;background:transparent;border:none;outline:none;font-family:'Lato',sans-serif;font-size:14px;line-height:1;color:var(--color-text-primary);padding:8px 0 8px 4px;resize:none;overflow:hidden}
.j-actions{display:flex;gap:8px;padding-top:16px;border-top:0.5px solid var(--color-border-tertiary);margin-top:4px;flex-wrap:wrap}
.j-btn-save{padding:9px 22px;background:linear-gradient(135deg,#e8909f,#a54d62);color:white;border:none;border-radius:50px;font-family:'Lato',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:opacity .18s}
.j-btn-save:hover{opacity:.85}
.j-btn-out{padding:9px 18px;background:transparent;color:#8a6a35;border:0.5px solid #c9a96e;border-radius:50px;font-family:'Lato',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .18s}
.j-btn-out:hover{background:#faf3e6}
.j-btn-clr{padding:9px 18px;background:transparent;color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:50px;font-family:'Lato',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .18s}
.j-btn-clr:hover{color:#d4788a;border-color:#f0d6de}
.j-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);background:#a54d62;color:white;padding:10px 22px;border-radius:50px;font-family:'Lato',sans-serif;font-size:11px;letter-spacing:1.5px;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap}
.j-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.j-mood{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.j-mood-lbl{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--color-text-secondary);margin-right:2px}
.j-mood-btn{padding:5px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:50px;font-size:12px;cursor:pointer;background:var(--color-background-secondary);transition:all .15s;color:var(--color-text-secondary)}
.j-mood-btn.sel{border-color:#d4788a;background:#f9eef1;color:#a54d62}
.j-weather{display:flex;gap:6px;margin-top:4px}
.j-wx-btn{width:30px;height:30px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--color-background-secondary);font-size:14px;transition:all .15s}
.j-wx-btn.sel{border-color:#c9a96e;background:#faf3e6}
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Her Sacred Space — Daily Journal</h2>

<div class="j-wrap">
<div class="j-book">

  <div class="j-top">
    <div class="j-logo">Her Sacred Space</div>
    <div class="j-tagline">Daily Journal</div>
  </div>

  <div class="j-body">

    <div class="j-row-3">
      <div class="j-field">
        <span class="j-lbl">Date</span>
        <input class="j-input" type="date" id="j-date">
      </div>
      <div class="j-field">
        <span class="j-lbl">Day of week</span>
        <input class="j-input" type="text" id="j-day" placeholder="Monday…" readonly>
      </div>
      <div class="j-field">
        <span class="j-lbl">Time</span>
        <input class="j-input" type="time" id="j-time">
      </div>
    </div>

    <div class="j-row">
      <div class="j-field">
        <span class="j-lbl">Mood</span>
        <div class="j-mood" style="margin-bottom:0;margin-top:2px">
          <button class="j-mood-btn" data-mood="Grateful">Grateful</button>
          <button class="j-mood-btn" data-mood="Hopeful">Hopeful</button>
          <button class="j-mood-btn" data-mood="Peaceful">Peaceful</button>
          <button class="j-mood-btn" data-mood="Anxious">Anxious</button>
          <button class="j-mood-btn" data-mood="Tired">Tired</button>
          <button class="j-mood-btn" data-mood="Joyful">Joyful</button>
        </div>
      </div>
      <div class="j-field">
        <span class="j-lbl">Weather</span>
        <div class="j-weather">
          <div class="j-wx-btn" data-wx="Sunny" title="Sunny">☀️</div>
          <div class="j-wx-btn" data-wx="Cloudy" title="Cloudy">☁️</div>
          <div class="j-wx-btn" data-wx="Rainy" title="Rainy">🌧️</div>
          <div class="j-wx-btn" data-wx="Stormy" title="Stormy">⛈️</div>
          <div class="j-wx-btn" data-wx="Snowy" title="Snowy">❄️</div>
          <div class="j-wx-btn" data-wx="Windy" title="Windy">💨</div>
        </div>
      </div>
    </div>

    <div class="j-verse-box">
      <input class="j-verse-input" id="j-verse" type="text" placeholder="Today's verse or intention… e.g. Psalm 46:10 — Be still and know…">
    </div>

    <div class="j-divider"><span class="j-divider-lbl">Today's Goals</span></div>

    <div class="j-goals">
      <div class="j-goals-list" id="j-goals-list"></div>
    </div>

    <div class="j-divider"><span class="j-divider-lbl">Journal</span></div>

    <div class="j-lines-label">Entry</div>
    <div class="j-lines" id="j-lines"></div>

    <div class="j-actions">
      <button class="j-btn-save" id="j-save">Save Entry</button>
      <button class="j-btn-out" onclick="window.print()">Print</button>
      <button class="j-btn-clr" id="j-clear">Clear</button>
    </div>

  </div>
</div>
</div>

<div class="j-toast" id="j-toast"></div>

<script>
(function(){
  function g(id){return document.getElementById(id)}
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];

  var now=new Date();
  var pad=function(n){return n<10?'0'+n:n};
  g('j-date').value=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  g('j-day').value=days[now.getDay()];
  g('j-time').value=pad(now.getHours())+':'+pad(now.getMinutes());

  g('j-date').addEventListener('change',function(){
    var d=new Date(this.value+'T12:00:00');
    g('j-day').value=days[d.getDay()];
  });

  var selectedMood='', selectedWx='';

  document.querySelectorAll('[data-mood]').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('[data-mood]').forEach(function(b){b.classList.remove('sel')});
      btn.classList.add('sel');
      selectedMood=btn.getAttribute('data-mood');
    });
  });

  document.querySelectorAll('[data-wx]').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('[data-wx]').forEach(function(b){b.classList.remove('sel')});
      btn.classList.add('sel');
      selectedWx=btn.getAttribute('data-wx');
    });
  });

  var goalList=g('j-goals-list');
  var goalValues=['','','','',''];
  var goalDone=[false,false,false,false,false];

  function renderGoals(){
    goalList.innerHTML='';
    for(var i=0;i<5;i++){
      (function(idx){
        var row=document.createElement('div');
        row.className='j-goal-row';
        var chk=document.createElement('div');
        chk.className='j-check'+(goalDone[idx]?' done':'');
        chk.addEventListener('click',function(){
          goalDone[idx]=!goalDone[idx];
          renderGoals();
        });
        var inp=document.createElement('input');
        inp.className='j-goal-input'+(goalDone[idx]?' done-text':'');
        inp.placeholder='Goal '+(idx+1)+'…';
        inp.value=goalValues[idx];
        inp.addEventListener('input',function(){goalValues[idx]=this.value});
        inp.addEventListener('keydown',function(e){
          if(e.key==='Enter'&&idx<4){
            var next=goalList.querySelectorAll('.j-goal-input')[idx+1];
            if(next)next.focus();
          }
        });
        row.appendChild(chk);
        row.appendChild(inp);
        goalList.appendChild(row);
      })(i);
    }
  }
  renderGoals();

  var lineCount=20;
  var lineValues=[];
  for(var i=0;i<lineCount;i++)lineValues.push('');

  var linesEl=g('j-lines');
  for(var i=0;i<lineCount;i++){
    (function(idx){
      var row=document.createElement('div');
      row.className='j-line-row';
      var num=document.createElement('span');
      num.className='j-line-num';
      num.textContent=idx+1;
      var wrap=document.createElement('div');
      wrap.className='j-line-area';
      var ta=document.createElement('textarea');
      ta.rows=1;
      ta.value=lineValues[idx];
      ta.style.cssText='position:absolute;inset:0;width:100%;background:transparent;border:none;outline:none;font-family:Lato,sans-serif;font-size:14px;line-height:1;color:var(--color-text-primary);padding:14px 0 8px 4px;resize:none;overflow:hidden';
      ta.addEventListener('input',function(){lineValues[idx]=this.value});
      ta.addEventListener('keydown',function(e){
        if(e.key==='Enter'){
          e.preventDefault();
          var rows=linesEl.querySelectorAll('textarea');
          if(idx<lineCount-1)rows[idx+1].focus();
        }
      });
      wrap.appendChild(ta);
      row.appendChild(num);
      row.appendChild(wrap);
      linesEl.appendChild(row);
    })(i);
  }

  function toast(msg){
    var t=g('j-toast');
    t.textContent=msg;t.classList.add('on');
    setTimeout(function(){t.classList.remove('on')},2400);
  }

  g('j-save').addEventListener('click',function(){
    var goals=goalValues.map(function(v,i){return{text:v,done:goalDone[i]}}).filter(function(g){return g.text.trim()});
    var entry={
      date:g('j-date').value,
      day:g('j-day').value,
      time:g('j-time').value,
      mood:selectedMood,
      weather:selectedWx,
      verse:g('j-verse').value,
      goals:goals,
      lines:lineValues.join('\n'),
      ts:Date.now()
    };
    var saved=JSON.parse(localStorage.getItem('hss_journal')||'[]');
    saved.unshift(entry);
    localStorage.setItem('hss_journal',JSON.stringify(saved));
    toast('✦ Entry saved!');
  });

  g('j-clear').addEventListener('click',function(){
    g('j-date').value=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
    g('j-day').value=days[now.getDay()];
    g('j-time').value=pad(now.getHours())+':'+pad(now.getMinutes());
    g('j-verse').value='';
    selectedMood=''; selectedWx='';
    document.querySelectorAll('[data-mood],[data-wx]').forEach(function(b){b.classList.remove('sel')});
    goalValues=['','','','',''];
    goalDone=[false,false,false,false,false];
    renderGoals();
    lineValues=[];
    for(var i=0;i<lineCount;i++)lineValues.push('');
    linesEl.querySelectorAll('textarea').forEach(function(ta){ta.value=''});
    toast('Cleared ✦');
  });
})();
</script>
